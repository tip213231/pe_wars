settings:
  debug: false
  currency-symbol: "$"
  # Клавиша открытия меню на клиенте (только для справки, реальный бинд в клиентском моде).
  client-key: "H"

economy:
  # Цена рейда (п.2 ТЗ: 1000). Списывается с банка атакующего города.
  raid-cost: 1000
  # Цена войны (п.2 ТЗ: 5000). Списывается с банка атакующего города.
  war-cost: 5000

storage:
  # Хранилище состояния (п.16 ТЗ): sqlite (по умолчанию) или mysql / mariadb.
  # Сохраняются: активные войны/рейды, захваченные чанки, кулдауны, установленные флаги.
  # Для mysql при наличии HikariCP в classpath автоматически используется пул соединений.
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: pe_wars
    user: root
    password: ""

raid:
  # Кулдаун после рейда между ЭТИМИ двумя городами, часы (п.2 ТЗ: 1 день = 24; п.13 упоминает 3 дня = 72).
  cooldown-hours: 24
  # Фаза подготовки рейда (минуты, п.2 ТЗ: 15).
  preparation-minutes: 15
  # Активная фаза рейда (минуты, п.2 ТЗ: 30).
  active-minutes: 30
  # Если в зоне рейда нет атакующих N секунд — рейд считается отбитым (п.10 ТЗ).
  no-attackers-timeout-seconds: 60
  # Минимум онлайн-игроков в городе-защитнике для объявления рейда (п.2 ТЗ: 4).
  min-online: 4
  # Атакующий может строить во время активного рейда (п.10 ТЗ).
  allow-build: true
  # Процент казны города-защитника, получаемый атакующими при победе (п.10 ТЗ: 50%).
  win-bank-percent: 50
  # Блоки, которые разрешено ломать атакующим при активном рейде.
  # По ТЗ (п.10): дерево, доски, стекло, двери (кроме железных), люки (кроме железных).
  breakable-blocks:
    # Дерево (брёвна)
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - CHERRY_LOG
    - CRIMSON_STEM
    - WARPED_STEM
    - STRIPPED_OAK_LOG
    - STRIPPED_SPRUCE_LOG
    - STRIPPED_BIRCH_LOG
    - STRIPPED_JUNGLE_LOG
    - STRIPPED_ACACIA_LOG
    - STRIPPED_DARK_OAK_LOG
    - STRIPPED_MANGROVE_LOG
    - STRIPPED_CHERRY_LOG
    - OAK_WOOD
    - SPRUCE_WOOD
    - BIRCH_WOOD
    - JUNGLE_WOOD
    - ACACIA_WOOD
    - DARK_OAK_WOOD
    - MANGROVE_WOOD
    - CHERRY_WOOD
    # Доски
    - OAK_PLANKS
    - SPRUCE_PLANKS
    - BIRCH_PLANKS
    - JUNGLE_PLANKS
    - ACACIA_PLANKS
    - DARK_OAK_PLANKS
    - MANGROVE_PLANKS
    - CHERRY_PLANKS
    - BAMBOO_PLANKS
    - CRIMSON_PLANKS
    - WARPED_PLANKS
    # Двери (кроме железной)
