war:
  # Кулдаун после войны между ЭТИМИ двумя городами, часы (п.2/п.13 ТЗ: 7 дней = 168).
  cooldown-hours: 168
  # Фаза подготовки войны (минуты, п.2 ТЗ: 1 час = 60).
  preparation-minutes: 60
  # Активная фаза войны (минуты, п.2 ТЗ: 2 часа = 120).
  active-minutes: 120
  # Завершение войны, если атакующих нет в зоне города N минут.
  no-attackers-timeout-minutes: 15
  # Минимум онлайн-игроков в городе-защитнике для объявления войны (п.2 ТЗ: 3).
  min-online: 3
  # Процент чанков города для победы атакующих (п.2/п.8 ТЗ: 75).
  victory-chunk-percent: 75
  # Разрешить TNT и другие взрывы во время активной войны (п.2/п.11 ТЗ).
  allow-explosions: true
  # Разрешить строительство участникам во время активной войны (п.2/п.11 ТЗ).
  allow-build: true
  # Разрешить разрушение блоков участникам во время активной войны (п.2/п.11 ТЗ).
  allow-break: true
  # Игроки без нации в зоне войны получают эффект голода (п.4 ТЗ).
  hunger-for-nationless: true
  # УСТАРЕЛО (не используется при новой логике войны). Оставлено для обратной совместимости.
  extra-breakable-blocks: []

  # Контейнеры, ЗАЩИЩЁННЫЕ от разрушения во время войны.
  # Атакующие НЕ могут ломать эти блоки даже в активной фазе войны.
  # Поддерживаются namespaced-id модовых блоков (например, create:item_vault).
  protected-containers:
    - minecraft:chest
    - minecraft:trapped_chest
    - minecraft:barrel
    - create:item_vault

  # ДОПОЛНИТЕЛЬНЫЕ команды, запрещённые участникам во время АКТИВНОЙ фазы войны ИЛИ рейда (п.14 ТЗ).
  # Базовый блок-лист зашит в код: /t delete, /t withdraw, /t toggle * и др. — его обойти нельзя.
  blocked-commands-during-war:
    - "t deposit"
    - "town deposit"
    - "n deposit"
    - "nation deposit"
    - "n withdraw"
    - "nation withdraw"
    - "t invite"
    - "town invite"
    - "t add"
    - "town add"
    - "t kick"
    - "town kick"
    - "t leave"
    - "town leave"
    - "n add"
    - "nation add"
    - "n kick"
    - "nation kick"
    - "t spawn"
    - "town spawn"
    - "res spawn"
    - "tpa"
    - "tpaccept"
    - "tpdeny"
    - "tp"
    - "teleport"
    - "rtp"
    - "wild"
    - "home"
    - "spawn"
    - "warp"
    - "back"
  # Запрет телепортации в мирные зоны/фермы/центральные чанки при войне.
  block-spawn-teleports: true

capture:
  # Сколько секунд флаг захвата должен простоять, чтобы чанк был захвачен (1 мин = 60).
  # Таймер идёт только когда на чанке нет защитников (п.5 ТЗ).
  flag-seconds: 60
  # Сколько секунд нужно просто стоять в чанке (без флага), чтобы его захватить (2 мин = 120).
  no-flag-seconds: 120
  # Сколько секунд защитники должны удерживать чанк без атакующих, чтобы вернуть его (п.6 ТЗ).
  recapture-seconds: 120
  # Сколько флагов нужно успешно захватить в ЦЕНТРАЛЬНОМ чанке (п.7 ТЗ: 2).
  central-flags-required: 2
  # Минимум атакующих в центральном чанке для захвата (п.2/п.7 ТЗ: 5).
  central-min-attackers: 5
  # Радиус (в блоках) вокруг флага, где запрещено размещать любые блоки (п.5 ТЗ).
  no-blocks-radius: 3
  # Рецепт крафта флага захвата (п.2 ТЗ). Форма 3x3, символы — ингредиенты ниже, пробел — пустая клетка.
  recipe:
    shape:
      - "WGW"
      - "WIW"
      - " B "
    ingredients:
      W: RED_WOOL
      G: GOLD_INGOT
      I: IRON_INGOT
      B: RED_BANNER

containers:
  # Контейнеры, разрешённые к разрушению при АКТИВНОМ рейде.
  # Поддерживаются namespaced-id модовых блоков (например, create:item_vault).
  # При разрушении содержимое выпадает атакующему как обычные предметы.
  breakable:
    - minecraft:chest
    - minecraft:trapped_chest
    - minecraft:barrel
    - minecraft:shulker_box
    - create:item_vault

sounds:
  # Звуки для участников войны/рейда (атакующие + защитники) при старте/завершении.
  # Имена — валидные значения org.bukkit.Sound или кастомные ключи (например pe_wars:war_declared).
  enabled: true
  war-declared: "pe_wars:war_declared"
  war-start: ENTITY_ENDER_DRAGON_GROWL
  war-end: UI_TOAST_CHALLENGE_COMPLETE
  raid-start: ENTITY_WITHER_SPAWN
  raid-end: UI_TOAST_CHALLENGE_COMPLETE
  volume: 0.6
  pitch: 1.0

