name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build server plugin
        run: ./gradlew :server-plugin:build --no-daemon --stacktrace

      - name: Build NeoForge client
        run: ./gradlew :client-neoforge:build --no-daemon --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: pe_wars-jars
          path: |
            server-plugin/build/libs/*.jar
            client-neoforge/build/libs/*.jar
          if-no-files-found: warn
